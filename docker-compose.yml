services:
  bookdrop:
    build: .
    ports:
      - "8080:8000"
    environment:
      BOOKDROP_DATABASE_URL: sqlite:////app/data/bookdrop.db
      BOOKDROP_DISCORD_WEBHOOK_URL: ${BOOKDROP_DISCORD_WEBHOOK_URL:-}
      BOOKDROP_SMTP_HOST: ${BOOKDROP_SMTP_HOST:-}
      BOOKDROP_SMTP_PORT: ${BOOKDROP_SMTP_PORT:-587}
      BOOKDROP_SMTP_USERNAME: ${BOOKDROP_SMTP_USERNAME:-}
      BOOKDROP_SMTP_PASSWORD: ${BOOKDROP_SMTP_PASSWORD:-}
      BOOKDROP_SMTP_FROM_ADDRESS: ${BOOKDROP_SMTP_FROM_ADDRESS:-}
      BOOKDROP_AUDIOBOOKSHELF_URL: ${BOOKDROP_AUDIOBOOKSHELF_URL:-}
      BOOKDROP_AUDIOBOOKSHELF_API_TOKEN: ${BOOKDROP_AUDIOBOOKSHELF_API_TOKEN:-}
      BOOKDROP_GOOGLE_BOOKS_API_KEY: ${BOOKDROP_GOOGLE_BOOKS_API_KEY:-}
    volumes:
      - bookdrop-data:/app/data

volumes:
  bookdrop-data:
